<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Codes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Tim's Map Codes</h1>

  <!-- Map 1 -->
  <div class="map-card">
    <div class="map-name">Track 1</div>
    <button onclick="copyCode('code1', this)">Copy Code</button>
    <div id="code1" class="hidden"></div>
  </div>

  <!-- Map 2 -->
  <div class="map-card">
    <div class="map-name">Monza Temple of Sped</div>
    <button onclick="copyCode('code2', this)">Copy Code</button>
    <div id="code2" class="hidden"></div>
  </div>

  <!-- Map 3 -->
  <div class="map-card">
    <div class="map-name">Downforce or Forced Down</div>
    <button onclick="copyCode('code3', this)">Copy Code</button>
    <div id="code3" class="hidden"></div>
  </div>

  <footer class="footer-container">
    <a class="github-link" href="https://github.com/YOUR-GITHUB-USERNAME" target="_blank" rel="noopener">
      <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/github.svg" alt="GitHub">
    </a>
    <span>© 2025 Gao Productions</span>
  </footer>

  <script>
    function copyCode(codeId, button) {
      const codeElement = document.getElementById(codeId);
      const codeText = codeElement.textContent.trim();
      if (!codeText) return;

      navigator.clipboard.writeText(codeText).then(() => {
        const originalText = button.textContent;
        button.textContent = "Copied!";
        setTimeout(() => {
          button.textContent = originalText;
        }, 2000);
      });
    }
  </script>

</body>
</html>
